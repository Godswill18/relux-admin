server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. `proxied any` is required: this container sits
    # behind the deployment's reverse proxy, and nginx skips proxied requests
    # by default.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    # Vite's fingerprinted build output: the name changes when the content does.
    # ^~ so the image rule below can't override these.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker must always be re-checked or updates never arrive.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else in /public keeps a fixed name, so it can't be immutable.
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # index.html: always revalidated, so a deploy reaches users straight away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
